[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qingjiao-redact-community"
version = "0.1.0"
description = "Open-source local Chinese document redaction, human review, reversible restore, and MCP privacy gateway powered by Alibaba ModelScope RaNER."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
ner = [
    "modelscope>=1.18.0,<2.0.0",
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.36.0,<5.0.0",
    "datasets<3.0.0",
    "numpy<2.0.0",
]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
qingjiao-redact = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
